services:
  postgres:
    image: postgres:16-alpine
    container_name: tripcom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tripcom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tripcom}
      POSTGRES_DB: ${DB_NAME:-tripcom}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chạy tự động lần đầu khi volume còn trống
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tripcom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tripcom-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
